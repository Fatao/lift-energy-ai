# Render "Blueprint": New + -> Blueprint -> pick your GitHub repo. Free plan, builds the Dockerfile.
services:
  - type: web
    name: lift-energy-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true            # every git push to the main branch redeploys the site
    envVars:
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD       # Render asks you for the value when you create the service
        sync: false
      - key: LLM_PROVIDER
        value: gigachat
      - key: GIGACHAT_AUTH_KEY  # Render asks you for the value when you create the service
        sync: false
      - key: GIGACHAT_SCOPE
        value: GIGACHAT_API_PERS
      - key: GIGACHAT_MODEL
        value: GigaChat
      - key: GIGACHAT_CA_BUNDLE # public Russian root certificate, see certs/README.md
        value: certs/russian_trusted_root_ca.pem
      - key: SEED_FILE          # the disk is wiped on restart, so the sample data is re-imported at start
        value: sample/