services:
  - type: web
    name: lift-energy-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: LLM_PROVIDER        # gemini or gigachat
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GIGACHAT_CREDENTIALS   # authorization key from developers.sber.ru
        sync: false
      - key: GIGACHAT_SCOPE
        value: GIGACHAT_API_PERS
      - key: GIGACHAT_MODEL
        value: GigaChat
      - key: GIGACHAT_VERIFY_SSL_CERTS   # Sber uses a Russian CA that Render's image does not trust
        value: "false"
      - key: SEED_FILE
        value: sample/test_data_30days.xlsx