# Render "Blueprint": New + -> Blueprint -> pick your GitHub repo. Free plan, builds the Dockerfile.
services:
  - type: web
    name: lift-energy-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true            # every git push to the main branch redeploys the site
    envVars:
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD       # Render asks you for the value when you create the service
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SEED_FILE          # the disk is wiped on restart, so the sample data is re-imported at start
        value: sample/test_data_30days.xlsx